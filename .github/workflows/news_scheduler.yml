name: TaizNews AI Automated Newsroom

on:
  workflow_dispatch:
  schedule:
    # Runs 4 times daily at peak engagement times (Yemen Time UTC+3):
    # - 10:00 UTC = 13:00 (1:00 PM الظهر)
    # - 13:00 UTC = 16:00 (4:00 PM العصر)
    # - 18:00 UTC = 21:00 (9:00 PM ليلاً)
    # - 21:00 UTC = 00:00 (12:00 AM منتصف الليل)
    - cron: '0 10,13,18,21 * * *'

permissions:
  contents: write

jobs:
  run-newsroom:
    name: Collect, Edit, Render & Publish
    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg & Raqm for Arabic rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pillow
          pip install -r requirements.txt

      - name: Run TaizNews AI Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID_1: ${{ secrets.ELEVENLABS_VOICE_ID_1 }}
          ELEVENLABS_VOICE_ID_2: ${{ secrets.ELEVENLABS_VOICE_ID_2 }}
          DRY_RUN: "false"
          MAX_POSTS_PER_RUN: "2"
        run: |
          python -m app.main

      - name: Commit and push tracking & history files
        run: |
          git config --global user.name "taiznews-bot"
          git config --global user.email "bot@taiznews.ai"
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync published history [skip ci]" && git push)
