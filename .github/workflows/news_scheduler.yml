name: TaizNews AI Automated Newsroom

on:
  workflow_dispatch:
  schedule:
    # Runs every 2 hours between 5:00 UTC and 19:00 UTC (8:00 AM to 10:00 PM Sana'a Time)
    - cron: '0 5,7,9,11,13,15,17,19 * * *'

permissions:
  contents: write

jobs:
  run-newsroom:
    name: Collect, Edit, Render & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TaizNews AI Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          DRY_RUN: "false"
          MAX_POSTS_PER_RUN: "2"
        run: |
          python -m app.main

      - name: Commit and push tracking & history files
        run: |
          git config --global user.name "taiznews-bot"
          git config --global user.email "bot@taiznews.ai"
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync published history [skip ci]" && git push)
